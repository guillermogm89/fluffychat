name: Prototype Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate_prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - run: flutter pub get
      - name: Format sticker picker and show diff
        run: |
          dart format lib/pages/chat/sticker_picker_dialog.dart
          git diff -- lib/pages/chat/sticker_picker_dialog.dart
      - name: Upload formatted sticker picker
        uses: actions/upload-artifact@v7
        with:
          name: formatted-sticker-picker
          path: lib/pages/chat/sticker_picker_dialog.dart
      - name: Analyze without Firebase
        run: flutter analyze
      - name: Add Firebase Messaging
        run: ./scripts/add-firebase-messaging.sh
      - name: Analyze with Firebase
        run: flutter analyze
      - name: Run tests
        run: flutter test
