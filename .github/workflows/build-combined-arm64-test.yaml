name: Build Combined ARM64 Android Test APK

on:
  push:
    branches:
      - test/combined-stickers-compression-arm64

jobs:
  build_arm64_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free_up_space
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: ./scripts/add-firebase-messaging.sh
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Upload Combined ARM64 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: fluffychat-combined-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
